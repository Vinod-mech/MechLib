{% extends "base.html" %}

{% block title %}Page Not Found - {{ super() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle fa-4x text-warning mb-3"></i>
        <h1 class="display-4">404 - Page Not Found</h1>
        <p class="lead text-muted">Sorry, the page you're looking for doesn't exist.</p>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-primary me-2">
            <i class="fas fa-home me-1"></i>Go Home
        </a>
        <a href="{{ url_for('search') }}" class="btn btn-outline-secondary">
            <i class="fas fa-search me-1"></i>Search Resources
        </a>
    </div>
</div>
{% endblock %}
