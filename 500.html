{% extends "base.html" %}

{% block title %}Server Error - {{ super() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-server fa-4x text-danger mb-3"></i>
        <h1 class="display-4">500 - Server Error</h1>
        <p class="lead text-muted">Something went wrong on our end. Please try again later.</p>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
